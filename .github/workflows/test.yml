name: Patch tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.3', '1.26.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            third_party/ddtrace-sarama/go.sum
            third_party/ddtrace-ibm-sarama/go.sum
            third_party/ddtrace-ibm-sarama-v2.10.1/go.sum
      - name: Both supported Sarama profiles (unit, race and vet)
        run: bash scripts/test-sarama-matrix.sh
      - name: IBM backpressure regression and vet
        run: bash scripts/test-ibm-matrix.sh
      - name: Build the standalone verifier
        run: go build -o "$RUNNER_TEMP/verify-official" ./patches/verify-official.go
      - name: Test effective dependency checks
        run: go test -race ./patches/verify-official.go ./patches/verify-official_test.go
      - name: Check compatibility runner syntax
        run: bash -n scripts/test-official-compat.sh scripts/test-sarama-matrix.sh scripts/test-ibm-compat.sh scripts/test-ibm-pipeline.sh scripts/test-ibm-matrix.sh scripts/test-release-package.sh scripts/test-unused-v1.sh scripts/test-ibm-auto-only.sh
      - name: Unused manual tracer and automatic-only binary verification
        run: |
          bash scripts/test-unused-v1.sh
          bash scripts/test-ibm-auto-only.sh
      - name: Check release packaging
        run: |
          bash -n scripts/build-release.sh
          bash scripts/build-release.sh v0.2.3 "$GITHUB_SHA"
          bash scripts/build-release.sh v0.2.3 "$GITHUB_SHA"
          cd dist/v0.2.3
          sha256sum -c SHA256SUMS
